<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vehicle Hub PK">
  <defs>
    <linearGradient id="vhg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1aa85a"/>
      <stop offset="100%" stop-color="#038b45"/>
    </linearGradient>
  </defs>
  <!-- brand disc -->
  <circle cx="32" cy="32" r="30" fill="url(#vhg)"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#f5bb18" stroke-width="2"/>
  <!-- tyre / rim -->
  <circle cx="32" cy="32" r="17.5" fill="none" stroke="#fff" stroke-width="2.6"/>
  <circle cx="32" cy="32" r="12.2" fill="none" stroke="#fff" stroke-width="1.6" opacity="0.9"/>
  <!-- spokes (stop short of hub so checkmark stays clear) -->
  <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.95">
    <path d="M32 15.2v5.6M32 43.2v5.6M15.2 32h5.6M43.2 32h5.6"/>
    <path d="M20.1 20.1l4 4M39.9 39.9l4 4M43.9 20.1l-4 4M24.1 39.9l-4 4"/>
  </g>
  <!-- verification hub -->
  <circle cx="32" cy="32" r="9.2" fill="#fff"/>
  <path d="M27.2 32.2l3.1 3.1 6.6-6.8" fill="none" stroke="#038b45" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
